{{- $name := include "plane.componentName" (dict "root" . "component" "live") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  replicas: {{ .Values.live.replicaCount }}
  selector:
    matchLabels:
      {{- include "plane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: live
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: live
    spec:
      serviceAccountName: {{ include "plane.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: live
          image: {{ include "plane.image" (dict "root" $ "suffix" "live" "override" .Values.live.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.live.port }}
              protocol: TCP
          envFrom:
            {{- include "plane.envFrom" . | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.live.port | quote }}
            {{- /*
              The shared ConfigMap carries the trailing-slash form Django wants
              for LIVE_BASE_PATH; the express router needs it without, so it is
              overridden here (env beats envFrom).
            */}}
            - name: LIVE_BASE_PATH
              value: {{ .Values.live.basePath | trimSuffix "/" | quote }}
          startupProbe:
            httpGet:
              path: {{ printf "%s/health" (.Values.live.basePath | trimSuffix "/") }}
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health" (.Values.live.basePath | trimSuffix "/") }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health" (.Values.live.basePath | trimSuffix "/") }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.live.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.live.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "plane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: live
