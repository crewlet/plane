{{- if .Values.secrets.create }}
{{- /*
  Only for installs that manage their own secret material. Deployments backed by
  an external secret store leave create=false and consume the secret it syncs
  instead (see extraEnvFrom).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plane.secretName" . }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.create is true, so secrets.secretKey is required" .Values.secrets.secretKey | quote }}
  DATABASE_URL: {{ required "secrets.create is true, so secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  LIVE_SERVER_SECRET_KEY: {{ required "secrets.create is true, so secrets.liveServerSecretKey is required" .Values.secrets.liveServerSecretKey | quote }}
  {{- if .Values.rabbitmq.enabled }}
  RABBITMQ_PASSWORD: {{ required "secrets.create is true and rabbitmq is enabled, so secrets.rabbitmqPassword is required" .Values.secrets.rabbitmqPassword | quote }}
  {{- else }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  {{- end }}
{{- end }}
