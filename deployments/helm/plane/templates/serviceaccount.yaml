{{- if .Values.serviceAccount.create }}
{{- /*
  Created as a pre-install/pre-upgrade hook, one weight ahead of the migrator,
  because the migrator runs as a hook itself and names this account. Hooks are
  applied before every ordinary resource, so an account rendered as one would
  not exist yet when the job's pod is admitted, and the job would spin on
  FailedCreate while the install waited on the job.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plane.serviceAccountName" . }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
